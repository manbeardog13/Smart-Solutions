name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run so no manual Settings step
          # is needed. If the token lacks permission, enable Pages once in
          # Settings -> Pages -> Source: GitHub Actions, then re-run.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The app is the repo root (no build step). Archives (site/,
          # reference/, catalogue originals) ride along as static files.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
