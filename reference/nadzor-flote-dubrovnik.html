<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Smart Solutions — Nadzor flote · Dubrovnik</title>
<style>
:root{
  --red:#DD0426; --white:#FFFFFF; --night:#121212;
  --red-d:#B00320; --red-soft:rgba(221,4,38,.08);
  --ink:#121212; --ink2:#4F4F4F; --ink3:#6B6B6B; --ink4:#BDBDBD; --ink5:#E4E4E4;
  --paper:#F7F7F6; --sunk:rgba(18,18,18,.05);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.72);
  --line:rgba(18,18,18,.10); --line2:rgba(18,18,18,.18);
  --mapbg:#121212; --mapland:#1E1E1E; --mapline:#2E2E2E;
  --display:"Archivo Black","Arial Black","Helvetica Neue",-apple-system,BlinkMacSystemFont,
            "Segoe UI",Roboto,system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sb:230px;
  /* snappy: fast-out, no overshoot, no spring */
  --snap:cubic-bezier(.2,0,0,1); --t:.14s;
}
:root[data-theme="dark"]{
  --ink:#F4F4F4; --ink2:#B0B0B0; --ink3:#8C8C8C; --ink4:#4E4E4E; --ink5:#2C2C2C;
  --paper:#0D0D0D; --sunk:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.2);
  --mapbg:#000000; --mapland:#161616; --mapline:#2A2A2A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);min-height:100%}
body{font-family:var(--sans);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;
     transition:background .18s linear,color .18s linear}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* something for the glass to refract */
.wash{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(680px 460px at 88% -6%, rgba(221,4,38,.13), transparent 62%),
             radial-gradient(560px 420px at 4% 104%, rgba(18,18,18,.10), transparent 60%)}
:root[data-theme="dark"] .wash{
  background:radial-gradient(680px 460px at 88% -6%, rgba(221,4,38,.20), transparent 62%),
             radial-gradient(560px 420px at 4% 104%, rgba(255,255,255,.05), transparent 60%)}

.shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh;position:relative;z-index:1}

/* ══ sidebar ══ */
aside{padding:20px 13px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;
      background:var(--glass);backdrop-filter:blur(26px) saturate(190%);
      -webkit-backdrop-filter:blur(26px) saturate(190%);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.mark{width:34px;height:34px;flex:0 0 34px;color:var(--red);display:grid;place-items:center}
.lg{width:100%;height:100%;display:block}
/* wordmark is lowercase in the logo — do not uppercase it */
.wm{display:flex;flex-direction:column;line-height:.92}
.wm b{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:-.045em;
      text-transform:lowercase;color:var(--red)}
nav{display:flex;flex-direction:column;gap:1px}
/* the edge-removal move: radius snaps away, a red rail cuts in. No translate. */
.nl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13px;
    font-weight:700;color:var(--ink2);text-align:left;width:100%;position:relative;overflow:hidden;
    transition:border-radius var(--t) var(--snap),background var(--t) linear,color var(--t) linear}
.nl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);
            transform:scaleY(0);transform-origin:top;transition:transform var(--t) var(--snap)}
.nl:hover{border-radius:0;background:var(--sunk);color:var(--ink)}
.nl:hover::before{transform:scaleY(1)}
.nl.on{border-radius:0;background:var(--night);color:#fff}
:root[data-theme="dark"] .nl.on{background:var(--red)}
.nl.on::before{transform:scaleY(1)}
:root[data-theme="dark"] .nl.on::before{background:#fff}
.nl.on .ic{color:var(--red)}
:root[data-theme="dark"] .nl.on .ic{color:#fff}
.nl .ic{width:16px;height:16px;flex:0 0 16px;color:var(--ink3);transition:color var(--t) linear}
.nl .bdg{margin-left:auto;font-size:10px;font-weight:800;padding:1px 6px;background:var(--red);
         color:#fff;font-variant-numeric:tabular-nums}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* theme slider — red lives beneath the knob */
.theme{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;width:100%;
       transition:border-radius var(--t) var(--snap),background var(--t) linear}
.theme:hover{border-radius:0;background:var(--sunk)}
.tr{width:44px;height:24px;flex:0 0 44px;border-radius:13px;background:var(--red);position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tr i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
      transition:transform .16s var(--snap),background .16s linear}
:root[data-theme="dark"] .tr i{transform:translateX(20px);background:var(--night)}
.theme .lbl{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
            color:var(--ink3)}
.acct{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;background:var(--sunk);
      transition:border-radius var(--t) var(--snap)}
.acct:hover{border-radius:0}
.av{width:28px;height:28px;flex:0 0 28px;background:var(--night);color:#fff;display:grid;place-items:center;
    font-family:var(--display);font-weight:900;font-size:11px}
:root[data-theme="dark"] .av{background:var(--red)}
.acct b{font-size:12px;font-weight:800;display:block;line-height:1.15}
.acct span{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.lcl{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--ink3);font-weight:800;
     letter-spacing:.11em;text-transform:uppercase;padding:0 4px}
.lcl i{width:5px;height:5px;background:var(--red);animation:bl 1.6s steps(1,end) infinite}
@keyframes bl{0%,50%{opacity:1}51%,100%{opacity:.25}}

main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--glass2);backdrop-filter:blur(26px) saturate(190%);
     -webkit-backdrop-filter:blur(26px) saturate(190%);border-bottom:1px solid var(--line);
     padding:13px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;
        letter-spacing:-.035em;margin:0;line-height:1}
.meta{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.top .sub{margin-top:4px}
.demo{font-size:8.5px;font-weight:900;letter-spacing:.12em;color:#fff;background:var(--red);
      padding:3px 7px;text-transform:uppercase}
.counts{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.cnt{display:flex;align-items:center;gap:7px;background:var(--glass);
     backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
     font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;
     transition:border-radius var(--t) var(--snap),border-color var(--t) linear,color var(--t) linear}
.cnt:hover{border-radius:0;border-color:var(--line2);color:var(--ink)}
.cnt.on{border-radius:0;border-color:var(--red);color:var(--ink)}
.cnt b{font-variant-numeric:tabular-nums;font-weight:900;color:var(--ink);font-size:12px}

.mk{width:8px;height:8px;flex:0 0 8px;border-radius:50%}
.mk.ok{background:var(--ink5);box-shadow:inset 0 0 0 1px var(--ink4)}
.mk.warn{background:transparent;box-shadow:inset 0 0 0 2px var(--red)}
.mk.crit{background:var(--red)}
.mk.stale{background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 2px,transparent 2px,transparent 4px);
          box-shadow:inset 0 0 0 1px var(--ink)}
.mk.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink4)}

.scroller{flex:1}
.pad{padding:22px 26px 90px;max-width:1660px;margin:0 auto}
.r3d{transition:opacity .34s var(--snap),transform .34s var(--snap)}
.r3d.pre{opacity:0;transform:translateY(14px)}

/* ══ glass panels — NO hover transform anywhere ══ */
.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(190%);
       -webkit-backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--line);
       border-radius:14px;overflow:hidden;transition:border-radius var(--t) var(--snap)}
.panel.night{background:var(--night);border-color:transparent;color:#fff}
.panel.night .meta{color:rgba(255,255,255,.45)}
.ph{padding:14px 16px 11px;display:flex;align-items:center;gap:10px}
.ph h2{font-family:var(--display);font-weight:900;font-size:12.5px;text-transform:uppercase;
       letter-spacing:-.02em;margin:0}
.seg{display:flex;background:var(--sunk);border-radius:7px;padding:2px;margin-left:auto}
.panel.night .seg{background:rgba(255,255,255,.1)}
.seg button{padding:7px 13px;min-height:26px;font-size:9.5px;font-weight:900;border-radius:5px;
            color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;
            transition:border-radius var(--t) var(--snap),background var(--t) linear,color var(--t) linear}
.seg button:hover{border-radius:0;color:var(--ink)}
.seg button.on{border-radius:0;background:var(--night);color:#fff}
.panel.night .seg button{color:rgba(255,255,255,.5)}
.panel.night .seg button.on{background:var(--red);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--red)}

/* ══ kpi ══ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:11px}
@media(max-width:1040px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--glass);backdrop-filter:blur(24px) saturate(190%);
     -webkit-backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--line);
     border-radius:12px;padding:15px 16px 13px;position:relative;overflow:hidden;
     transition:border-radius var(--t) var(--snap),border-color var(--t) linear}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);
             transform:scaleY(0);transform-origin:top;transition:transform var(--t) var(--snap)}
.kpi:hover{border-radius:0;border-color:var(--line2)}
.kpi:hover::before{transform:scaleY(1)}
.kpi.alarm{background:var(--red);border-color:transparent;color:#fff}
.kpi.alarm .meta{color:rgba(255,255,255,.65)}
.kpi.alarm::before{background:#fff}
.kpi .v{font-family:var(--display);font-weight:900;font-size:38px;letter-spacing:-.05em;margin-top:6px;
        line-height:.9;font-variant-numeric:tabular-nums}
.kpi.alarm .v{color:#fff}
.spark{height:20px;margin-top:8px;display:block;width:100%}
.px{display:flex;gap:2px;margin-top:9px}
.px i{height:6px;flex:1}
/* live tick: colour flash only, no motion */
@keyframes lit{0%{color:var(--red)}100%{}}
.lit{animation:lit .5s linear}

/* ══ map ══ */
.mapbox{position:relative;aspect-ratio:1/.8;background:var(--mapbg)}
svg.map{display:block;width:100%;height:100%}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .ring{fill:none;stroke-width:1.6;transition:stroke-width .12s linear}
.pin:hover .ring{stroke-width:4}
.pin:focus{outline:none}
.pin:focus-visible .ring{stroke:#fff;stroke-width:4}
.pulse{transform-box:fill-box;transform-origin:center;animation:ping 1.8s linear infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.6);opacity:0}}
.maplbl{font-size:7.5px;fill:rgba(255,255,255,.4);font-weight:800;letter-spacing:.16em;
        text-transform:uppercase;pointer-events:none;font-family:var(--sans)}

/* ══ rows ══ */
.rows{max-height:560px;overflow-y:auto}
.row{display:flex;align-items:center;gap:11px;padding:11px 16px;width:100%;text-align:left;
     position:relative;overflow:hidden;transition:background var(--t) linear}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);
             transform:scaleY(0);transform-origin:center;transition:transform var(--t) var(--snap)}
.row:hover{background:var(--sunk)}
.row:hover::before{transform:scaleY(1)}
.row.sel{background:var(--red-soft)}
.row.sel::before{transform:scaleY(1)}
.row .b{flex:1;min-width:0}
.row .n{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:9px;color:var(--ink3);margin-top:2px;letter-spacing:.08em;text-transform:uppercase;
        font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:0 0 auto}
.row .big{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:-.04em;
          font-variant-numeric:tabular-nums;display:block}
.row .ag{font-size:8.5px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase}
.tag{font-size:7.5px;font-weight:900;letter-spacing:.09em;padding:2px 4px;background:var(--red);color:#fff}

/* ══ building ══ */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:11px;margin-bottom:11px}
.bwrap{display:grid;grid-template-columns:1fr 1.1fr;gap:11px}
@media(max-width:1180px){.bwrap{grid-template-columns:1fr}}
@media(max-width:900px){.hero{grid-template-columns:1fr}.mapbox{aspect-ratio:44/47}}
.bld{padding:16px}
.roof{background:var(--night);padding:12px;color:#fff}
:root[data-theme="dark"] .roof{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.rh{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;display:flex;
    justify-content:space-between;color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .rh{color:var(--ink3)}
.rh b{color:#fff}
:root[data-theme="dark"] .rh b{color:var(--ink)}
.casc{display:flex;gap:4px;margin-top:10px}
.hp{flex:1;padding:8px 3px;text-align:center;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);transition:border-color .12s linear}
:root[data-theme="dark"] .hp{background:rgba(255,255,255,.05);border-color:var(--line)}
.hp:hover{border-color:var(--red)}
.hp .id{font-size:7.5px;color:rgba(255,255,255,.42);font-weight:900;letter-spacing:.1em}
:root[data-theme="dark"] .hp .id{color:var(--ink3)}
.hp .hz{font-family:var(--display);font-weight:900;font-size:12px;margin-top:3px;letter-spacing:-.02em;
        color:#fff;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .hp .hz{color:var(--ink)}
.hp.idle .hz{color:rgba(255,255,255,.28)}
.hp.err{background:var(--red);border-color:transparent}
.hp.err .hz,.hp.err .id{color:#fff}
.floor{display:flex;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--line);
       padding:8px 11px;margin-top:3px;position:relative;overflow:hidden;
       transition:border-color var(--t) linear}
.floor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);
               transform:scaleY(0);transition:transform var(--t) var(--snap)}
.floor:hover{border-color:var(--line2)}
.floor:hover::before{transform:scaleY(1)}
.floor.hot{border-color:var(--red)}
.floor .fn{font-family:var(--mono);font-size:9.5px;color:var(--ink3);width:19px;font-weight:700}
.floor .fbar{flex:1;height:3px;background:var(--sunk);overflow:hidden}
.bar-i{display:block;height:100%}
.floor .ft{font-family:var(--display);font-weight:900;font-size:11.5px;width:42px;text-align:right;
           letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.floor .fz{font-size:8px;color:var(--ink3);width:22px;text-align:right;letter-spacing:.09em;font-weight:800}
.base{background:var(--sunk);padding:10px 11px;margin-top:3px;display:flex;justify-content:space-between;
      font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink2)}

/* ══ tabs / tiles ══ */
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:2px;margin:0 0 13px}
.tabs button{flex:1;padding:9px;font-size:9.5px;font-weight:900;border-radius:6px;color:var(--ink3);
             letter-spacing:.11em;text-transform:uppercase;
             transition:border-radius var(--t) var(--snap),background var(--t) linear,color var(--t) linear}
.tabs button:hover{border-radius:0;color:var(--ink)}
.tabs button.on{border-radius:0;background:var(--night);color:#fff}
:root[data-theme="dark"] .tabs button.on{background:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:11px;
      position:relative;overflow:hidden;
      transition:border-radius var(--t) var(--snap),border-color var(--t) linear}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);
              transform:scaleY(0);transition:transform var(--t) var(--snap)}
.tile:hover{border-radius:0;border-color:var(--line2)}
.tile:hover::before{transform:scaleY(1)}
.tile .k{display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.tile .v{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.045em;margin-top:5px;
         font-variant-numeric:tabular-nums;line-height:1}
.tile .u{font-size:10.5px;color:var(--ink3);font-weight:800}
.tile .reg{font-size:8px;color:var(--ink3);margin-top:5px;letter-spacing:.1em;font-family:var(--mono)}
.tile.stale{border-color:var(--ink);
  background:repeating-linear-gradient(45deg,var(--glass2),var(--glass2) 5px,var(--sunk) 5px,var(--sunk) 10px)}
.tile.stale .v{text-decoration:line-through;color:var(--ink3)}
.tile.alarm{background:var(--red);border-color:transparent}
.tile.alarm .v{color:#fff}.tile.alarm .k span,.tile.alarm .reg{color:rgba(255,255,255,.7)}
.age{font-size:8px;color:var(--ink3);letter-spacing:.08em}
h3.sec{font-size:9px;color:var(--ink3);font-weight:900;letter-spacing:.16em;text-transform:uppercase;
       margin:18px 0 8px}

/* ══ alarms ══ */
.al{background:var(--glass2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:8px;
    position:relative;overflow:hidden;
    transition:border-radius var(--t) var(--snap),border-color var(--t) linear}
.al:hover{border-radius:0;border-color:var(--line2)}
.al::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.al.sev-crit::after{background:var(--red)}
.al.sev-major::after{background:repeating-linear-gradient(180deg,var(--red),var(--red) 4px,transparent 4px,transparent 8px)}
.al.sev-stale::after{background:repeating-linear-gradient(180deg,var(--ink),var(--ink) 3px,transparent 3px,transparent 6px)}
.al .code{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:-.035em;
          display:flex;align-items:baseline;gap:7px}
.al .code em{font-style:normal;font-size:9px;color:var(--ink3);font-family:var(--mono);font-weight:400;
             letter-spacing:.06em}
.al .desc{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
.al .desc i{font-style:normal;color:var(--ink3)}
.al .m{margin-top:7px}
.pills{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:8px;font-weight:900;padding:3px 6px;letter-spacing:.1em;text-transform:uppercase}
.p-act{background:var(--red);color:#fff}
.p-un{background:var(--night);color:#fff}
:root[data-theme="dark"] .p-un{background:var(--ink5);color:var(--ink)}
.p-ak{background:var(--sunk);color:var(--ink2)}
.p-rt{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--ink4)}
.acts{display:flex;gap:5px;margin-top:10px}
.acts button{flex:1;background:var(--sunk);border-radius:7px;padding:9px 4px;font-size:9.5px;
             font-weight:900;color:var(--ink2);letter-spacing:.1em;text-transform:uppercase;
             transition:border-radius var(--t) var(--snap),background var(--t) linear,color var(--t) linear}
.acts button:hover{border-radius:0;background:var(--ink5);color:var(--ink)}
.acts button.pri{background:var(--red);color:#fff}

function spark(p,c){const w=200,h=20,mx=Math.max(...p),mn=Math.min(...p);

      vector-effect="non-scaling-stroke"/></svg>`;}

  if(io)io.disconnect();

    {threshold:0,rootMargin:"0px 0px -3% 0px"});
  els.forEach(e=>{if(e.getBoundingClientRect().top>innerHeight*.94){e.classList.add("pre");io.observe(e);}});
