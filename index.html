<link rel="stylesheet" href="css/app.css">
<script>
// Before first paint: honor the stored theme (or the OS) so dark-mode users
// never get a white flash while the module graph loads.
try {
  var t = JSON.parse(localStorage.getItem("ss.theme"));
  if (t === null || t === undefined) t = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", t ? "dark" : "light");
} catch (e) { /* default light */ }
</script>
</head>
<body>
<div id="app-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Smart Solutions Operativa zahtijeva JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
